<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyiv Power Outage Heatmap - Yasno</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #fff;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .heatmap-container {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .heatmap-title {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #fff;
        }
        .heatmap {
            display: grid;
            grid-template-columns: repeat(48, 1fr);
            gap: 2px;
        }
        .hour-cell {
            aspect-ratio: 1;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: bold;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .hour-cell:hover {
            transform: scale(1.1);
            z-index: 10;
        }
        .hour-label {
            font-size: 10px;
            opacity: 0.8;
        }
        .legend {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #16213e;
            border-radius: 12px;
            padding: 15px;
        }
        .stat-card h3 {
            color: #888;
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #e94560;
        }
        .stat-value.good {
            color: #10b981;
        }
        .stat-label {
            color: #888;
            margin-top: 5px;
            font-size: 12px;
        }
        .stat-more {
            font-size: 0.65em;
            color: #666;
            cursor: default;
            border-bottom: 1px dashed #555;
        }
        .stat-more:hover {
            color: #aaa;
        }
        .stat-more-slots {
            display: block;
            text-align: right;
            font-size: 0.55em;
            color: #666;
            cursor: default;
            border-bottom: 1px dashed #555;
            display: inline;
            float: right;
            margin-top: 6px;
        }
        .stat-more-slots:hover {
            color: #aaa;
        }
        .stat-list {
            font-size: 13px;
            color: #ccc;
        }
        .stat-list li {
            margin: 4px 0;
            list-style: none;
        }
        .ranking-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 13px;
            transition: background 0.15s;
        }
        .ranking-row:hover {
            background: rgba(255,255,255,0.05);
        }
        .ranking-rank {
            width: 32px;
            text-align: center;
            font-weight: bold;
            color: #888;
            flex-shrink: 0;
        }
        .ranking-row.top .ranking-rank {
            color: #e94560;
        }
        .ranking-row.bottom .ranking-rank {
            color: #10b981;
        }
        .ranking-bar-wrap {
            flex: 1;
            min-height: 24px;
            min-width: 0;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            position: relative;
        }
        .ranking-bar {
            height: 100%;
            border-radius: 6px;
            transition: width 0.4s ease;
            display: flex;
            align-items: center;
            padding: 0 8px;
            min-height: 24px;
            overflow: hidden;
        }
        .ranking-bar-groups {
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            color: #fff;
            max-width: 100%;
        }
        .ranking-bar-overflow {
            position: absolute;
            top: 0;
            height: 100%;
            line-height: 24px;
            display: none;
            padding: 0 8px;
            font-size: 11px;
            font-weight: 600;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
            box-sizing: border-box;
        }
        .ranking-duration {
            width: 55px;
            text-align: center;
            color: #ccc;
            font-size: 13px;
            flex-shrink: 0;
        }
        .detailed-grid-wrap {
            position: relative;
        }
        .detailed-grid-wrap .scroll-shadow-right {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 20px;
            pointer-events: none;
            background: linear-gradient(to left, rgba(22,33,62,0.95), transparent);
            z-index: 4;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .detailed-grid-wrap.has-scroll-right .scroll-shadow-right {
            opacity: 1;
        }
        .detailed-grid-scroll {
            overflow-x: auto;
            position: relative;
        }
        .grid-sticky-label {
            position: sticky;
            left: 0;
            z-index: 3;
            background: #16213e;
            font-size: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
        }
        .detailed-grid-scroll.no-overflow .grid-sticky-label {
            background: transparent;
        }
        .grid-sticky-label::after {
            content: '';
            position: absolute;
            top: 0;
            right: -20px;
            width: 20px;
            height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.5), transparent);
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .detailed-grid-scroll.scrolled .grid-sticky-label::after {
            opacity: 1;
        }
        @media (max-width: 600px) {
            .ranking-duration { width: 45px; }
            .container {
                padding-bottom: 40px;
            }
            .refresh-btn {
                top: auto !important;
                bottom: 16px !important;
                left: 50% !important;
                right: auto !important;
                transform: translateX(-50%);
                padding: 12px 32px !important;
                border-radius: 24px !important;
                font-size: 15px !important;
                background: #1a1a2e !important;
                border: 1px solid #333 !important;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            }
        }
        .ranking-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }
        .ranking-chip {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 56px;
            padding: 5px 0;
            border-radius: 16px;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
        }
        .ranking-chip .chip-duration {
            font-weight: normal;
            font-size: 11px;
            opacity: 0.7;
        }
        .summary-bar {
            background: #16213e;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
        }
        .summary-item {
            text-align: center;
        }
        .summary-item .value {
            font-size: 1.8em;
            font-weight: bold;
            color: #e94560;
        }
        .summary-item .value.good {
            color: #10b981;
        }
        .summary-item .label {
            font-size: 11px;
            color: #888;
        }
        .group-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 3px;
            margin-top: 20px;
        }
        .group-cell {
            height: 12px;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            cursor: pointer;
        }
        .group-cell:hover {
            outline: 2px solid #fff;
        }
        .tooltip {
            position: fixed;
            background: #0f0f23;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 13px;
            pointer-events: none;
            z-index: 1000;
            display: none;
        }
        .bar-chart {
            position: relative;
            height: 240px;
            padding: 10px 10px 10px 0;
        }
        .chart-grid {
            position: absolute;
            top: 10px;
            left: 40px;
            right: 0;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .grid-line {
            border-top: 1px dashed #333;
            position: relative;
        }
        .grid-label {
            position: absolute;
            left: -35px;
            top: -8px;
            font-size: 10px;
            color: #666;
        }
        .chart-area {
            position: absolute;
            top: 10px;
            left: 40px;
            right: 0;
            bottom: 30px;
        }
        .chart-line {
            fill: none;
            stroke: #e94560;
            stroke-width: 2;
        }
        .chart-fill {
            fill: url(#chartGradient);
        }
        .chart-dot {
            fill: #e94560;
            cursor: pointer;
        }
        .chart-dot:hover {
            fill: #ff6b6b;
            r: 5;
        }
        .bar {
            flex: 1;
            background: linear-gradient(to top, #e94560, #ff6b6b);
            border-radius: 4px 4px 0 0;
            position: relative;
            transition: opacity 0.2s;
        }
        .bar:hover {
            opacity: 0.8;
        }
        .bar-label {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #888;
        }
        .hour-labels {
            display: grid;
            grid-template-columns: repeat(48, 1fr);
            gap: 2px;
            text-align: center;
            font-size: 8px;
            color: #888;
            margin-top: 5px;
        }
        .hour-labels.chart-labels {
            margin-left: 40px;
            margin-right: 10px;
            display: flex;
            justify-content: space-between;
        }
        .hour-labels.chart-labels div {
            flex: 0 0 auto;
            min-width: 0;
            text-align: center;
        }
        .hour-labels.power-status-labels {
            margin-left: 0;
            margin-right: 0;
            display: flex;
            justify-content: space-between;
        }
        .hour-labels.power-status-labels div {
            flex: 1;
            min-width: 0;
            text-align: center;
        }
        .chart-legend {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 11px;
            white-space: nowrap;
            color: #888;
        }
        .power-legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 25px;
            font-size: 11px;
            padding: 10px 0;
        }
        .power-legend span {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
        }
        .power-legend-color {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
        .address-lookup {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .address-lookup .heatmap-title {
            margin-bottom: 12px;
        }
        .address-form {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .address-field {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .address-field label {
            display: block;
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .address-field input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a2e;
            color: #eee;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .address-field input:focus {
            border-color: #e94560;
        }
        .address-field input::placeholder {
            color: #555;
        }
        .address-field input:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .address-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #0f0f23;
            border: 1px solid #333;
            border-radius: 8px;
            margin-top: 4px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 500;
            display: none;
        }
        .address-dropdown.visible {
            display: block;
        }
        .address-dropdown-item {
            padding: 10px 14px;
            font-size: 13px;
            color: #ccc;
            cursor: pointer;
            border-bottom: 1px solid #1a1a2e;
            transition: background 0.15s;
        }
        .address-dropdown-item:last-child {
            border-bottom: none;
        }
        .address-dropdown-item:hover,
        .address-dropdown-item.active {
            background: #1f2b4a;
            color: #fff;
        }
        .address-dropdown-empty {
            padding: 12px 14px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }
        .address-dropdown-loading {
            padding: 12px 14px;
            font-size: 12px;
            color: #888;
            text-align: center;
        }
        .group-result {
            display: none;
            margin-top: 15px;
            padding: 12px 18px;
            background: rgba(233, 69, 96, 0.1);
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 8px;
            text-align: center;
            position: relative;
        }
        .group-result.visible {
            display: block;
        }
        .group-result-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
        }
        .group-action-btn {
            width: 26px;
            height: 26px;
            border: none;
            border-radius: 6px;
            background: rgba(255,255,255,0.08);
            color: #888;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
        }
        .group-action-btn:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        .group-action-btn.danger:hover {
            background: rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
        .btn-show-saved {
            display: block;
            margin: 8px auto 0;
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            background: rgba(255,255,255,0.06);
            color: #666;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .btn-show-saved:hover {
            background: rgba(255,255,255,0.12);
            color: #aaa;
        }
        .group-result .group-number {
            font-size: 1.6em;
            font-weight: bold;
            color: #e94560;
        }
        .group-result .group-label {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .group-result .group-schedule {
            margin-top: 12px;
        }
        .mini-timeline {
            position: relative;
            height: 22px;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            background: #1a1a2e;
        }
        .mini-timeline-seg {
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: rgba(255,255,255,0.8);
            overflow: hidden;
            white-space: nowrap;
        }
        .mini-timeline-seg.off {
            background: repeating-linear-gradient(
                -45deg,
                #dc2626,
                #dc2626 3px,
                #b91c1c 3px,
                #b91c1c 6px
            );
        }
        .mini-timeline-seg.on {
            background: #166534;
        }
        .mini-timeline-ticks {
            position: relative;
            height: 10px;
            margin-top: 2px;
        }
        .mini-timeline-tick {
            position: absolute;
            top: 0;
            font-size: 9px;
            color: #666;
            transform: translateX(-50%);
        }
        .mini-timeline-now {
            position: absolute;
            top: 0;
            width: 2px;
            height: 22px;
            background: #fbbf24;
            z-index: 2;
            pointer-events: none;
        }
        .mini-timeline-now::before {
            content: '▼';
            position: absolute;
            top: -11px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            color: #fbbf24;
        }
        .mini-timeline-summary {
            margin-top: 6px;
            font-size: 12px;
            color: #888;
        }
        .mini-timeline-summary .off-text { color: #ef4444; }
        .mini-timeline-summary .on-text { color: #10b981; }
        .group-result .group-percentile {
            margin-top: 10px;
            font-size: 13px;
            color: #ccc;
            line-height: 1.5;
        }
        .group-result .group-percentile .percentile-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .group-result .group-percentile .percentile-comment {
            font-size: 12px;
            color: #888;
            font-style: italic;
        }
        .group-result .group-percentile .percentile-comment .emoji {
            font-style: normal;
        }
        .highlight-group {
            outline: 3px solid #fbbf24 !important;
            outline-offset: -1px;
            border-radius: 3px;
        }
        .ranking-row.highlight-group {
            background: rgba(251, 191, 36, 0.15) !important;
            outline-offset: -2px;
        }
        .ranking-chip.highlight-group {
            outline-offset: 2px;
            transform: scale(1.1);
            border-radius: 16px;
        }
        .day-toggle {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .day-toggle-group {
            display: flex;
            background: #16213e;
            border-radius: 10px;
            padding: 4px;
            gap: 4px;
        }
        .day-toggle-btn {
            padding: 8px 24px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #888;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }
        .day-toggle-btn:hover {
            color: #ccc;
        }
        .day-toggle-btn.active {
            background: #e94560;
            color: #fff;
            box-shadow: 0 2px 8px rgba(233, 69, 96, 0.4);
        }
        .day-toggle-btn .day-date {
            display: block;
            font-size: 10px;
            font-weight: 400;
            opacity: 0.7;
            margin-top: 2px;
        }
        /* Mobile responsive */
        @media (max-width: 1080px) {
            body {
                padding: 10px;
            }
            h1 {
                font-size: 1.3em;
            }
            .heatmap {
                grid-template-columns: repeat(24, 1fr);
            }
            .hour-labels {
                grid-template-columns: repeat(24, 1fr);
            }
            .hour-labels.mobile-2h {
                grid-template-columns: repeat(12, 1fr);
            }
            .heatmap-container {
                padding: 15px;
            }
            .stat-card {
                padding: 12px;
            }
            .summary-bar {
                padding: 10px;
            }
            .summary-item .value {
                font-size: 1.4em;
            }
            .bar-chart {
                height: 220px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Kyiv Power Outage Heatmap</h1>
        <p class="subtitle">Yasno scheduled outages for Kyiv city</p>
        
        <div class="day-toggle">
            <div class="day-toggle-group">
                <button class="day-toggle-btn active" data-day="today" id="btnToday">📅 Today<span class="day-date" id="btnTodayDate"></span></button>
                <button class="day-toggle-btn" data-day="tomorrow" id="btnTomorrow">📅 Tomorrow<span class="day-date" id="btnTomorrowDate"></span></button>
            </div>
        </div>

        <div class="status-banner" id="statusBanner" style="display: none;"></div>
        
        <div class="address-lookup">
            <div class="heatmap-title">🏠 Find Your Group</div>
            <div class="address-form">
                <div class="address-field">
                    <label>Street</label>
                    <input type="text" id="streetInput" placeholder="Start typing street name..." autocomplete="off">
                    <div class="address-dropdown" id="streetDropdown"></div>
                </div>
                <div class="address-field">
                    <label>Building</label>
                    <input type="text" id="buildingInput" placeholder="Select street first" disabled autocomplete="off">
                    <div class="address-dropdown" id="buildingDropdown"></div>
                </div>
            </div>
            <div class="group-result" id="groupResult">
                <div class="group-result-actions">
                    <button class="group-action-btn" id="btnHideGroup" title="Hide">✕</button>
                    <button class="group-action-btn danger" id="btnClearGroup" title="Forget saved group">🗑</button>
                </div>
                <div class="group-number" id="groupNumber"></div>
                <div class="group-label" id="groupLabel"></div>
                <div class="group-schedule" id="groupSchedule"></div>
                <div class="group-percentile" id="groupPercentile"></div>
            </div>
            <button class="btn-show-saved" id="btnShowSaved" style="display:none;">📌 Show saved group</button>
        </div>
        
        <div class="summary-bar" id="summaryBar"></div>
        
        <div class="stats" id="stats"></div>

        <div class="heatmap-container">
            <div class="heatmap-title">📊 Outage Intensity, %</div>
            <div id="heatmapWrapper"></div>
            <div class="legend">

        let outageData = null;
        let selectedDay = 'today';

        // Parse data and calculate outages per 30-min slot
        function parseOutages(data, day) {
            day = day || selectedDay;
            const groups = Object.keys(data);
            const slotOutages = new Array(48).fill(0); // 48 x 30-min slots
            const groupSlotData = {};
            const groupStats = {}; // Track outage duration per group
            
            groups.forEach(groupId => {
                const slots = data[groupId][day]?.slots || [];
                groupSlotData[groupId] = new Array(48).fill(false);
                groupStats[groupId] = { outageMinutes: 0, outagePeriods: [] };
                
                slots.forEach(slot => {
                    if (slot.type === 'Definite') {
                        // Calculate outage duration
                        groupStats[groupId].outageMinutes += (slot.end - slot.start);
                        groupStats[groupId].outagePeriods.push({ start: slot.start, end: slot.end });
                        
                        const startSlot = Math.floor(slot.start / 30);
                        const endSlot = Math.ceil(slot.end / 30);
                        
                        for (let s = startSlot; s < endSlot && s < 48; s++) {
                            const slotStart = s * 30;
                            const slotEnd = (s + 1) * 30;
                            if (slot.start < slotEnd && slot.end > slotStart) {
                                if (!groupSlotData[groupId][s]) {
                                    groupSlotData[groupId][s] = true;
                                    slotOutages[s]++;
                                }
                            }
                        }
                    }
                });
            });
            
            return { hourlyOutages: slotOutages, groups, groupHourData: groupSlotData, groupStats };
        }

        function findConsecutiveRanges(slots, values, condition) {
            const matchingSlots = slots.map((v, i) => condition(v) ? i : -1).filter(i => i >= 0);
            if (matchingSlots.length === 0) return [];
            
            const ranges = [];
            let rangeStart = matchingSlots[0];
            let rangeEnd = matchingSlots[0];
            
            for (let i = 1; i < matchingSlots.length; i++) {
                if (matchingSlots[i] === rangeEnd + 1) {
                    rangeEnd = matchingSlots[i];
                } else {
                    ranges.push({ start: rangeStart, end: rangeEnd });
                    rangeStart = matchingSlots[i];
                    rangeEnd = matchingSlots[i];
                }
            }
            ranges.push({ start: rangeStart, end: rangeEnd });
            
            return ranges;
        }

        function formatRanges(ranges) {
            return ranges.map(r => {
                if (r.start === r.end) {
                    return formatSlotTime(r.start);
                }
                return `${formatSlotTime(r.start)}-${formatSlotTime(r.end + 1)}`;
            }).join(', ');
        }

        function formatSlotsCompact(ranges) {
            if (ranges.length === 0) return 'None';
            const first2 = formatRanges(ranges.slice(0, 2));
            // Count two-digit hours in first 2 ranges
            const twoDigitHours = (first2.match(/\b\d{2}:/g) || []).length;
            const showCount = twoDigitHours <= 1 ? Math.min(2, ranges.length) : 1;
            const visible = formatRanges(ranges.slice(0, showCount));
            const remaining = ranges.length - showCount;
            if (remaining <= 0) return visible;
            return `${visible} <span class="stat-more-slots" title="${formatRanges(ranges)}">see ${remaining} more</span>`;
        }

        function formatWithOverflow(visibleText, allItems, formatFn) {
            if (allItems.length <= 5) return visibleText;
            const extra = allItems.length - 5;
            const allText = formatFn(allItems);
            return `${visibleText} <span class="stat-more" title="${allText}">+${extra} more</span>`;
        }

        function formatDuration(minutes) {
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            if (hours === 0) return `${mins}m`;
            if (mins === 0) return `${hours}h`;
            return `${hours}h ${mins}m`;
        }

        function formatGroupId(groupId, allGroups) {
            // Check if all groups end with .1
            const allEndWith1 = allGroups.every(g => g.endsWith('.1'));
            if (allEndWith1 && groupId.endsWith('.1')) {
                return groupId.slice(0, -2);
            }
            return groupId;
        }

        function formatGroupIds(groupIds, allGroups) {
            return groupIds.map(id => formatGroupId(id, allGroups)).join(', ');
        }

        function getColor(percentage) {
            if (percentage >= 80) return '#ef4444';
            if (percentage >= 60) return '#f97316';
            if (percentage >= 40) return '#eab308';
            if (percentage >= 20) return '#84cc16';
            return '#10b981';
        }

        function formatSlotTime(slot) {
            const hour = Math.floor(slot / 2);
            const min = slot % 2 === 0 ? '00' : '30';
            return `${hour}:${min}`;
        }

        function renderHeatmap(hourlyOutages, totalGroups) {
            const wrapper = document.getElementById('heatmapWrapper');

            const isMobile = window.innerWidth <= 1080;
            
            function createCell(slot, count) {
                const percentage = (count / totalGroups) * 100;
                const cell = document.createElement('div');

                cell.innerHTML = `<span>${Math.round(percentage)}</span>`;
                cell.title = `${formatSlotTime(slot)} - ${formatSlotTime(slot + 1)}\n${count} groups affected (${percentage.toFixed(1)}%)`;
                return cell;
            }
            
            function createLabels(startSlot, endSlot, cols) {
                const labelsDiv = document.createElement('div');

                        label.textContent = `${Math.floor(i / 2)}`;
                    }
                    labelsDiv.appendChild(label);
                }
                return labelsDiv;
            }
            
            if (isMobile) {
                // Mobile: 2 rows with labels above first row and below second row

                const labels2 = createLabels(24, 48, 24);
                labels2.style.marginTop = '3px';
                wrapper.appendChild(labels2);
            } else {
                // Desktop: single row of 48 cells with labels below
                const heatmapRow = document.createElement('div');
                heatmapRow.className = 'heatmap';
                heatmapRow.style.gridTemplateColumns = 'repeat(48, 1fr)';
                for (let slot = 0; slot < 48; slot++) {
                    heatmapRow.appendChild(createCell(slot, hourlyOutages[slot]));

                wrapper.appendChild(heatmapRow);
                
                // Labels below
                const labels = document.createElement('div');
                labels.className = 'hour-labels';
                labels.style.gridTemplateColumns = 'repeat(48, 1fr)';
                labels.style.marginLeft = '0';
                labels.style.marginRight = '0';
                for (let i = 0; i < 48; i++) {

        function renderBarChart(hourlyOutages, totalGroups) {
            const container = document.getElementById('barChart');
            const labels = document.getElementById('barLabels');
            const svg = document.getElementById('lineChart');
            const maxCount = totalGroups; // Use total groups as max scale
            const isMobile = window.innerWidth <= 1080;
            
            // Get container dimensions
            const rect = container.getBoundingClientRect();
            const leftPadding = 40;
            const rightPadding = 10;
            const topPadding = 10;
            const bottomPadding = 40;
            const width = rect.width - leftPadding - rightPadding;
            const height = rect.height - topPadding - bottomPadding;
            const dotRadius = isMobile ? 2 : 3;
            
            // Create SVG content
            const gridLines = isMobile ? 4 : 5;
            let svgContent = `
                <defs>
                    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.4"/>
                        <stop offset="100%" style="stop-color:#e94560;stop-opacity:0.05"/>
                    </linearGradient>
                </defs>
            `;
            
            // Draw grid lines
            for (let i = 0; i <= gridLines; i++) {
                const y = topPadding + (height / gridLines) * i;
                const value = Math.round(maxCount - (maxCount / gridLines) * i);
                svgContent += `
                    <line x1="${leftPadding}" y1="${y}" x2="${leftPadding + width}" y2="${y}" stroke="#333" stroke-dasharray="4"/>
                    <text x="${leftPadding - 5}" y="${y + 4}" text-anchor="end" fill="#666" font-size="10">${value}</text>
                `;
            }
            
            // Build line path
            const points = hourlyOutages.map((count, i) => {
                const x = leftPadding + (width / 47) * i;
                const y = topPadding + height - (count / maxCount) * height;
                return { x, y, count, slot: i };
            });
            
            const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
            const areaPath = `${linePath} L ${points[points.length-1].x} ${topPadding + height} L ${points[0].x} ${topPadding + height} Z`;
            
            svgContent += `<path d="${areaPath}" class="chart-fill"/>`;
            svgContent += `<path d="${linePath}" class="chart-line"/>`;
            
            // Add dots - on mobile, show fewer dots but with larger tap targets
            const dotInterval = isMobile ? 2 : 1;
            const hitRadius = isMobile ? 12 : dotRadius;
            points.forEach((p, idx) => {
                if (idx % dotInterval === 0) {
                    const tipText = `${formatSlotTime(p.slot)}: ${p.count} groups`;
                    // Invisible larger hit area for mobile taps
                    svgContent += `<circle cx="${p.x}" cy="${p.y}" r="${hitRadius}" fill="transparent" class="chart-dot-hit" data-title="${tipText}" style="cursor:pointer;"/>`;
                    // Visible dot
                    svgContent += `<circle cx="${p.x}" cy="${p.y}" r="${dotRadius}" class="chart-dot" pointer-events="none">
                        <title>${tipText}</title>
                    </circle>`;
                }
            });
            
            // Y-axis label
            svgContent += `<text x="12" y="${topPadding + height/2}" text-anchor="middle" fill="#888" font-size="10" transform="rotate(-90, 12, ${topPadding + height/2})">Groups</text>`;

            // X-axis labels inside SVG at exact data point positions
            const labelInterval = isMobile ? 4 : 2;
            for (let slot = 0; slot < 48; slot++) {
                if (slot % labelInterval === 0) {
                    const x = leftPadding + (width / 47) * slot;
                    svgContent += `<text x="${x}" y="${topPadding + height + 16}" text-anchor="middle" fill="#888" font-size="9">${Math.floor(slot/2)}</text>`;
                }
            }

            // Legend inside SVG
            svgContent += `<circle cx="${leftPadding + 8}" cy="${topPadding + height + 30}" r="4" fill="#e94560"/>`;
            svgContent += `<text x="${leftPadding + 16}" y="${topPadding + height + 34}" fill="#888" font-size="10">Groups without power</text>`;

            svg.innerHTML = svgContent;
            labels.innerHTML = '';
            document.getElementById('barChartLegend').innerHTML = '';
        }

        function renderStats(hourlyOutages, totalGroups, groupStats, allGroups) {
            const container = document.getElementById('stats');
            const summaryBar = document.getElementById('summaryBar');
            container.innerHTML = '';
            summaryBar.innerHTML = '';
            
            const maxOutages = Math.max(...hourlyOutages);
            const minOutages = Math.min(...hourlyOutages);
            const avgOutages = hourlyOutages.reduce((a, b) => a + b, 0) / 48;
            
            // Find worst and best slots (all of them)
            const worstRanges = findConsecutiveRanges(hourlyOutages, hourlyOutages, v => v === maxOutages);
            const bestRanges = findConsecutiveRanges(hourlyOutages, hourlyOutages, v => v === minOutages);
            
            // Find worst and best groups
            const groupDurations = Object.entries(groupStats).map(([id, stats]) => ({
                id,
                minutes: stats.outageMinutes,
                powerOnMinutes: 1440 - stats.outageMinutes
            })).sort((a, b) => b.minutes - a.minutes);
            
            const worstDuration = groupDurations[0]?.minutes || 0;
            const bestDuration = groupDurations[groupDurations.length - 1]?.minutes || 0;
            
            const allWorstGroups = groupDurations.filter(g => g.minutes === worstDuration);
            const allBestGroups = groupDurations.filter(g => g.minutes === bestDuration);
            const worstGroups = allWorstGroups.slice(0, 5);
            const bestGroups = allBestGroups.slice(0, 5);
            
            // Summary bar
            summaryBar.innerHTML = `
                <div class="summary-item">
                    <div class="value">${totalGroups}</div>
                    <div class="label">Total Groups</div>
                </div>
                <div class="summary-item">
                    <div class="value">${formatDuration(worstDuration)}</div>
                    <div class="label">Max Outage Duration</div>
                </div>
                <div class="summary-item">
                    <div class="value">${formatDuration(bestDuration)}</div>
                    <div class="label">Min Outage Duration</div>
                </div>
                <div class="summary-item">
                    <div class="value">${formatDuration(Math.round(groupDurations.reduce((a, g) => a + g.minutes, 0) / groupDurations.length))}</div>
                    <div class="label">Avg Outage</div>
                </div>
                <div class="summary-item">
                    <div class="value good">${formatDuration(Math.round(groupDurations.reduce((a, g) => a + g.powerOnMinutes, 0) / groupDurations.length))}</div>
                    <div class="label">Avg Power On</div>
                </div>
            `;
            
            // Stats cards
            const cards = [
                {
                    title: '🔴 Worst Time Slots',
                    value: formatSlotsCompact(worstRanges),
                    label: `${maxOutages} groups affected (${Math.round(maxOutages/totalGroups*100)}%)`,
                    isGood: false

        function renderGroupRanking(groupStats, allGroups) {
            const container = document.getElementById('groupRanking');
            container.innerHTML = '';

            // Group by duration
            const byDuration = {};
            Object.entries(groupStats).forEach(([id, s]) => {
                const m = s.outageMinutes;
                if (!byDuration[m]) byDuration[m] = [];
                byDuration[m].push({ id, minutes: m, periods: s.outagePeriods });
            });

            // Sort durations descending, groups within same duration by number
            const durationGroups = Object.entries(byDuration)
                .map(([dur, groups]) => ({
                    minutes: Number(dur),
                    groups: groups.sort((a, b) => parseFloat(a.id) - parseFloat(b.id))
                }))
                .sort((a, b) => b.minutes - a.minutes);

            const maxMin = durationGroups[0]?.minutes || 1;
            const totalRanks = durationGroups.length;

            durationGroups.forEach((dg, i) => {
                const rank = i + 1;
                const barPct = maxMin > 0 ? Math.max(Math.round((dg.minutes / maxMin) * 100), dg.minutes > 0 ? 3 : 0) : 0;
                const isTop = rank <= 3;
                const isBottom = rank > totalRanks - 3;

                // Color gradient based on rank position
                const t = totalRanks > 1 ? i / (totalRanks - 1) : 1;
                const color = dg.minutes === 0 ? '#10b981'
                    : t < 0.5
                        ? `rgb(${Math.round(239 + (234-239)*t*2)},${Math.round(68 + (179-68)*t*2)},${Math.round(68 + (8-68)*t*2)})`
                        : `rgb(${Math.round(234 + (16-234)*(t-0.5)*2)},${Math.round(179 + (185-179)*(t-0.5)*2)},${Math.round(8 + (129-8)*(t-0.5)*2)})`;

                const groupIds = dg.groups.map(g => formatGroupId(g.id, allGroups)).join(', ');
                const periodsStr = dg.groups[0].periods.map(p => {
                    const sh = Math.floor(p.start / 60), sm = p.start % 60;
                    const eh = Math.floor(p.end / 60), em = p.end % 60;
                    return `${sh}:${String(sm).padStart(2,'0')}–${eh}:${String(em).padStart(2,'0')}`;
                }).join(', ') || 'No outages';

                const row = document.createElement('div');
                row.className = 'ranking-row' + (isTop ? ' top' : '') + (isBottom && !isTop ? ' bottom' : '');
                // Tag row with all group IDs for highlighting
                dg.groups.forEach(g => {
                    const span = document.createElement('span');
                    span.dataset.group = g.id.split('.')[0];
                    span.style.display = 'none';
                    row.appendChild(span);
                });
                row.innerHTML += `
                    <div class="ranking-rank">#${rank}</div>
                    <div class="ranking-bar-wrap" title="${groupIds}">
                        <div class="ranking-bar" style="width:${barPct}%;background:${color};">
                            <span class="ranking-bar-groups">${groupIds}</span>
                        </div>
                        <span class="ranking-bar-overflow">${groupIds}</span>
                    </div>
                    <div class="ranking-duration">${formatDuration(dg.minutes)}</div>
                `;
                container.appendChild(row);
            });

            // Show overflow labels where bar is too narrow for text
            requestAnimationFrame(() => {
                container.querySelectorAll('.ranking-bar-wrap').forEach(wrap => {
                    const bar = wrap.querySelector('.ranking-bar');
                    const inner = wrap.querySelector('.ranking-bar-groups');
                    const overflow = wrap.querySelector('.ranking-bar-overflow');
                    if (inner.scrollWidth > bar.clientWidth - 16) {
                        inner.style.visibility = 'hidden';
                        const leftPos = bar.clientWidth + 8;
                        overflow.style.left = leftPos + 'px';
                        overflow.style.maxWidth = (wrap.clientWidth - leftPos) + 'px';
                        overflow.style.display = 'block';
                    }
                });
            });
        }

                        : `rgb(${Math.round(234 + (16-234)*(t-0.5)*2)},${Math.round(179 + (185-179)*(t-0.5)*2)},${Math.round(8 + (129-8)*(t-0.5)*2)})`;

        async function fetchViaProxy(apiUrl) {
            for (const proxy of CORS_PROXIES) {
                try {
                    const res = await fetch(proxy.url + encodeURIComponent(apiUrl));
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    if (proxy.jsonWrapped) {
                        const wrapper = await res.json();
                        return JSON.parse(wrapper.contents);
                    }
                    return await res.json();
                } catch(e) {
                    continue;
                }
            }
            throw new Error('All proxies failed');
        }

        function updateGroupPercentile(groupId) {
            const el = document.getElementById('groupPercentile');
            if (!outageData) { el.innerHTML = ''; return; }

            const fullId = Object.keys(outageData).find(k => k.split('.')[0] === groupId);
            if (!fullId) { el.innerHTML = ''; return; }

            const myMinutes = outageData[fullId]?.[selectedDay]?.slots
                ?.filter(s => s.type === 'Definite')
                .reduce((sum, s) => sum + (s.end - s.start), 0) || 0;

            const allDurations = Object.values(outageData).map(g =>
                g[selectedDay]?.slots?.filter(s => s.type === 'Definite')
                    .reduce((sum, s) => sum + (s.end - s.start), 0) || 0
            );
            const totalGroups = allDurations.length;
            const betterThan = allDurations.filter(d => d > myMinutes).length;
            const percentile = Math.round((betterThan / totalGroups) * 100);
            const rank = allDurations.filter(d => d >= myMinutes).length - allDurations.filter(d => d === myMinutes).length + 1;
            const worstDuration = Math.max(...allDurations);

            let badgeColor, comment;
            if (myMinutes === 0) {
                badgeColor = '#10b981';
                comment = '<span class="emoji">🎉</span> No outages today! Living the dream!';
            } else if (percentile >= 80) {
                badgeColor = '#10b981';
                comment = '<span class="emoji">😎</span> Lucky you! Most groups have it way worse.';
            } else if (percentile >= 50) {
                badgeColor = '#84cc16';
                comment = '<span class="emoji">🙂</span> Not too bad, could be worse!';
            } else if (percentile >= 20) {
                badgeColor = '#eab308';
                comment = '<span class="emoji">😬</span> Hang in there... charge your stuff while you can.';
            } else if (myMinutes >= worstDuration) {
                badgeColor = '#ef4444';
                comment = '<span class="emoji">💀</span> F in the chat. Maximum darkness achieved.';
            } else {
                badgeColor = '#f97316';
                comment = '<span class="emoji">😩</span> Pretty rough. Candles are your friend today.';
            }

            el.innerHTML = `
                <span class="percentile-badge" style="background:${badgeColor};color:#fff;">
                    Better than ${percentile}% of groups
                </span>
                <br>
                <span class="percentile-comment">${comment}</span>
            `;
        }

        function formatGroupSchedule(groupId, day) {
            if (!outageData || !outageData[groupId]) return '';
            const dayData = outageData[groupId][day || selectedDay];
            if (!dayData?.slots || dayData.slots.length === 0) return '';

            const fmt = (m) => `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;

            // Build segments
            const segments = dayData.slots.map(s => {
                const pct = ((s.end - s.start) / 1440 * 100).toFixed(2);
                const isOff = s.type === 'Definite';
                const label = (s.end - s.start) >= 90 ? `${fmt(s.start)}–${fmt(s.end)}` : '';
                return `<div class="mini-timeline-seg ${isOff ? 'off' : 'on'}" style="width:${pct}%" title="${fmt(s.start)}–${fmt(s.end)} ${isOff ? 'OFF' : 'ON'}">${label}</div>`;
            }).join('');

            // Now marker (only for today)
            let nowMarker = '';
            if ((day || selectedDay) === 'today') {
                const now = new Date();
                const nowMin = now.getHours() * 60 + now.getMinutes();
                const nowPct = (nowMin / 1440 * 100).toFixed(2);
                nowMarker = `<div class="mini-timeline-now" style="left:${nowPct}%"></div>`;
            }

            // Hour ticks (every 3h)
            let ticks = '';
            for (let h = 0; h <= 24; h += 3) {
                const pct = (h / 24 * 100).toFixed(2);
                ticks += `<span class="mini-timeline-tick" style="left:${pct}%">${h}</span>`;
            }

            // Summary text
            const offSlots = dayData.slots.filter(s => s.type === 'Definite');
            const totalOff = offSlots.reduce((sum, s) => sum + (s.end - s.start), 0);
            const summaryParts = offSlots.map(s => `<span class="off-text">⚡${fmt(s.start)}–${fmt(s.end)}</span>`);
            const summary = totalOff > 0
                ? `${summaryParts.join(', ')} <span class="off-text">(${formatDuration(totalOff)} off)</span>`
                : '<span class="on-text">✅ Power on all day</span>';

            return `
                <div style="position:relative;">
                    ${nowMarker}
                    <div class="mini-timeline">${segments}</div>
                    <div class="mini-timeline-ticks">${ticks}</div>
                </div>
                <div class="mini-timeline-summary">${summary}</div>
            `;
        }

                banner.className = 'status-banner waiting';
                banner.innerHTML = `
                    <span class="banner-icon">🕐</span>
                    <div>
                        <strong>Schedule not yet available.</strong>
                        The outage schedule for this day hasn't been published yet. It usually appears a few hours before.
                    </div>`;
                banner.style.display = 'flex';
            } else if (statuses.size === 1 && statuses.has('NoOutages')) {
                banner.className = 'status-banner no-outages';
                banner.innerHTML = `
                    <span class="banner-icon">🎉</span>
                    <div>
                        <strong>No outages scheduled!</strong>
                        All groups have power for the entire day. Enjoy!
                    </div>`;
                banner.style.display = 'flex';
            } else {
                banner.style.display = 'none';
            }
        }

        function renderAll(data, day) {
            clearAllContainers();
            updateStatusBanner(data, day);
            const { hourlyOutages, groups, groupHourData, groupStats } = parseOutages(data, day);
            updateSubtitle(data, day);
            renderStats(hourlyOutages, groups.length, groupStats, groups);
            renderGroupRanking(groupStats, groups);
            renderGroupRankingList(groupStats, groups);
            renderHeatmap(hourlyOutages, groups.length);
            renderBarChart(hourlyOutages, groups.length);
            renderPowerStatusChart(hourlyOutages, groups.length);
            renderDetailedGrid(groupHourData, groups);
            // Re-apply group highlight & schedule after re-render
            if (highlightedGroupId) {
                applyGroupHighlight();
            }
            if (groupResult.classList.contains('visible')) {
                const gText = document.getElementById('groupNumber').textContent.replace('Group ', '');
                if (gText && gText !== 'Error') {
                    document.getElementById('groupSchedule').innerHTML = formatGroupSchedule(gText, day);
                }
            }
        }

        // Day toggle handling
        document.querySelectorAll('.day-toggle-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.dataset.day === selectedDay) return;
                selectedDay = btn.dataset.day;
                document.querySelectorAll('.day-toggle-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (outageData) {
                    renderAll(outageData, selectedDay);
                }
            });
        });

        async function fetchData() {
            showLoading();
            
            let lastError = null;
            
            // Try each CORS proxy in order until one works
            for (const proxy of CORS_PROXIES) {
                try {
                    console.log(`Trying ${proxy.name}...`);
                    const response = await fetch(proxy.url + encodeURIComponent(API_URL), {
                        headers: {
                            'Accept': 'application/json, text/plain, */*'
                        }
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    if (proxy.jsonWrapped) {
                        const wrapper = await response.json();
                        outageData = JSON.parse(wrapper.contents);
                    } else {
                        outageData = await response.json();
                    }
                    
                    if (!outageData || Object.keys(outageData).length === 0) {
                        throw new Error('No outage data received');
                    }
                    
                    console.log(`Success with ${proxy.name}`);
                    hideLoading();
                    renderAll(outageData, selectedDay);

                    // Restore saved group from localStorage
                    try {
                        const saved = JSON.parse(localStorage.getItem('savedGroup'));
                        if (saved && !localStorage.getItem('groupCardHidden')) {
                            showSavedGroup(saved);
                        }
                        updateShowSavedBtn();
                    } catch(e) {}

                    // Add refresh button if not exists
                    if (!document.querySelector('.refresh-btn')) {
                        const refreshBtn = document.createElement('button');
                        refreshBtn.className = 'refresh-btn';
                        refreshBtn.innerHTML = '🔄 Refresh';
                        refreshBtn.onclick = fetchData;
                        document.body.appendChild(refreshBtn);
                    }
                    
                    return; // Success - exit the function
                    
                } catch (error) {
                    console.warn(`${proxy.name} failed:`, error.message);
                    lastError = error;
                    // Continue to next proxy
                }
            }
            
            // All proxies failed
            console.error('All CORS proxies failed');
            showError(lastError?.message || 'All CORS proxies failed. Please try again later.');
        }

        // Initialize - fetch data on page load
        fetchData();
        
        // Detailed grid scroll shadows
        const gridScroll = document.getElementById('detailedGridScroll');
        const gridWrap = document.getElementById('detailedGridWrap');
        function updateGridScrollState() {
            const sl = gridScroll.scrollLeft;
            const maxScroll = gridScroll.scrollWidth - gridScroll.clientWidth;
            const hasOverflow = maxScroll > 1;
            gridScroll.classList.toggle('scrolled', sl > 0);
            gridScroll.classList.toggle('no-overflow', !hasOverflow);
            gridWrap.classList.toggle('has-scroll-right', sl < maxScroll - 1);
        }
        gridScroll.addEventListener('scroll', updateGridScrollState);
        new ResizeObserver(updateGridScrollState).observe(gridScroll);

        // Re-render on window resize for mobile responsiveness
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (outageData) {
                    renderAll(outageData, selectedDay);
                }
            }, 250);
        });
        // Mobile: show tooltips on tap for elements with title attribute
        (function() {
            const tooltip = document.getElementById('tooltip');
            let activeTitleEl = null;

            function showTitleTooltip(el, x, y) {
                const text = el.getAttribute('title') || el.getAttribute('data-title');
                if (!text) return;
                // Store and remove title to prevent native tooltip
                if (el.hasAttribute('title')) {
                    el.setAttribute('data-title', text);
                    el.removeAttribute('title');
                }
                tooltip.innerHTML = text.replace(/\n/g, '<br>');
                tooltip.style.display = 'block';
                // Position tooltip
                const tipRect = tooltip.getBoundingClientRect();
                let left = x - tipRect.width / 2;
                let top = y - tipRect.height - 10;
                if (left < 5) left = 5;
                if (left + tipRect.width > window.innerWidth - 5) left = window.innerWidth - tipRect.width - 5;
                if (top < 5) top = y + 20;
                tooltip.style.left = left + 'px';
                tooltip.style.top = top + 'px';
                activeTitleEl = el;
            }

            function hideTitleTooltip() {
                tooltip.style.display = 'none';
                activeTitleEl = null;
            }

            document.addEventListener('touchstart', (e) => {
                const el = e.target.closest('[title], [data-title]');
                if (el) {
                    const touch = e.touches[0];
                    showTitleTooltip(el, touch.clientX, touch.clientY);
                } else {
                    hideTitleTooltip();
                }
            }, { passive: true });

            // Also make detailed grid cells work on tap
            document.addEventListener('click', (e) => {
                const cell = e.target.closest('.group-cell');
                if (cell) {
                    const rect = cell.getBoundingClientRect();
                    cell.dispatchEvent(new MouseEvent('mouseenter', {
                        clientX: rect.left + rect.width / 2,
                        clientY: rect.top
                    }));
                    setTimeout(() => {
                        const tipRect = tooltip.getBoundingClientRect();
                        let top = rect.top - tipRect.height - 5;
                        if (top < 5) top = rect.bottom + 5;
                        tooltip.style.left = (rect.left + rect.width / 2 - tipRect.width / 2) + 'px';
                        tooltip.style.top = top + 'px';
                    }, 0);
                    return;
                }
                if (!e.target.closest('.tooltip') && !e.target.closest('[title]') && !e.target.closest('[data-title]')) {
                    hideTitleTooltip();
                    tooltip.style.display = 'none';
                }
            });
        })();
    </script>
</body>
</html>
